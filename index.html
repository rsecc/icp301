<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#58c674" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<title>访问受限 · 广然笔记</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --ink: #1f2328;
    --ink-2: #4e5969;
    --ink-3: #86909c;
    --line: #e5e6eb;
    --line-soft: #f2f3f5;
    --brand: #58c674;          /* 站点品牌绿 */
    --brand-2: #2ea84b;
    --brand-soft: #e8f7ed;
    --warn: #f7ba1e;            /* 温和警示：橙黄 */
    --warn-bg: #fff7e6;
    --warn-line: #ffe7ba;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, "PingFang SC", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* —— 16:9 画布 —— */
  .canvas {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 32px 48px;
  }

  /* —— 顶栏 —— */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--ink-3);
    font-size: 13px;
  }
  .topbar .crumb {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-2);
  }
  .topbar .crumb .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 0 4px var(--warn-bg);
  }
  .topbar .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
  }

  /* —— 主舞台 —— */
  .stage {
    display: grid;
    grid-template-columns: 1fr;
    place-items: center;
    min-height: 0;
    padding: 8px 0;
  }

  /* 主卡 */
  .card {
    width: min(820px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.02), 0 8px 24px rgba(31,35,40,.04);
    overflow: hidden;
  }

  /* —— Logo 区域：置顶、居中 —— */
  .brand {
    text-align: center;
    padding: 36px 32px 22px;
    border-bottom: 1px solid var(--line-soft);
    background:
      radial-gradient(600px 200px at 50% 0%, var(--brand-soft), transparent 70%);
  }
  .brand .logo {
    height: 64px;
    width: auto;
    display: block;
    margin: 0 auto 12px;
  }

  /* —— 正文 —— */
  .body {
    padding: 28px 40px 8px;
    text-align: center;
  }
  .notice {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    color: #ad6800;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    margin-bottom: 16px;
  }
  .notice svg { color: var(--warn); }

  .lead {
    font-size: 17px;
    line-height: 1.85;
    color: var(--ink-2);
    margin: 0 0 14px;
  }
  .lead strong {
    color: var(--ink);
    font-weight: 600;
    background: linear-gradient(180deg, transparent 60%, var(--brand-soft) 60%);
    padding: 0 4px;
    border-radius: 2px;
  }

  .hint {
    margin: 0 40px 28px;
    padding: 14px 18px;
    background: var(--line-soft);
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-2);
    text-align: left;
    box-sizing: border-box;
  }
  .hint .step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .hint .step + .step { margin-top: 8px; }
  .hint .num {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    font-size: 12px;
    font-family: var(--mono);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* —— IP 数据条 —— */
  .ip {
    margin: 20px 40px 28px;
    padding: 14px 18px;
    background: var(--line-soft);
    border-radius: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px 16px;
    box-sizing: border-box;
  }
  .ip .item .label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }
  .ip .item .value {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--ink);
    word-break: break-all;
    min-height: 18px;
    font-weight: 500;
  }
  .ip .item .value.bad {
    color: #d93025;
  }
  .skel {
    display: inline-block;
    height: 14px;
    width: 100px;
    border-radius: 3px;
    background: linear-gradient(90deg, #eaeaec 0%, #f4f4f5 50%, #eaeaec 100%);
    background-size: 200% 100%;
    animation: sh 1.5s linear infinite;
    vertical-align: middle;
  }
  .skel.s { width: 80px; }
  .skel.m { width: 120px; }
  .skel.l { width: 160px; }
  @keyframes sh { from{background-position:200% 0} to{background-position:-200% 0} }

  /* —— 底栏 —— */
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-3);
    padding: 8px 4px 0;
    border-top: 1px solid var(--line-soft);
  }
  .bottom a {
    color: var(--brand-2);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color .2s ease;
  }
  .bottom a:hover { border-bottom-color: var(--brand); }

  /* 上升进入 */
  .rise { opacity: 0; transform: translateY(16px); animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .rise.d1 { animation-delay: .05s; }
  .rise.d2 { animation-delay: .18s; }
  .rise.d3 { animation-delay: .32s; }
  .rise.d4 { animation-delay: .46s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* —— 响应式 —— */
  @media (max-aspect-ratio: 4/3) {
    html, body { overflow: auto; }
    .canvas { padding: 20px; }
    .ip { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .body { padding: 22px 22px 6px; }
    .ip { margin: 16px 22px 22px; }
    .brand { padding: 28px 22px 18px; }
    .lead { font-size: 15.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; animation: none; }
    .skel { animation: none; background: #eaeaec; }
    .topbar .crumb .dot { animation: none; }
  }
</style>
</head>
<body>

<div class="canvas">

  <!-- 顶栏 -->
  <header class="topbar rise d1">
    <span class="crumb">
      <span class="dot" aria-hidden="true"></span>
      安全中心 · Security Center
    </span>
    <span class="meta" aria-hidden="true">
      <span id="clock">--:--:--</span>
    </span>
  </header>

  <!-- 主体 -->
  <section class="stage">

    <article class="card rise d2" aria-labelledby="title">

      <!-- Logo 置顶居中 -->
      <header class="brand">
        <img class="logo" src="img/dx.png" alt="广然笔记" />
      </header>

      <!-- 正文 -->
      <div class="body">
        <span class="notice rise d3">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          温馨提示
        </span>

        <p class="lead rise d3" id="title">
          您正在通过<strong>非中国大陆境内 IP 地址</strong>访问本站，请您停止您的访问请求。
        </p>
        <p class="lead rise d3" style="margin-top:-6px;">
          如您使用了网络代理工具，请在关闭网络代理后，再次对本站发起请求。
        </p>

        <div class="ip rise d4" aria-label="当前访问信息">
          <div class="item">
            <span class="label">IP</span>
            <span class="value" id="ipValue"><span class="skel l"></span></span>
          </div>
          <div class="item">
            <span class="label">COUNTRY</span>
            <span class="value" id="countryValue"><span class="skel m"></span></span>
          </div>
          <div class="item">
            <span class="label">REGION</span>
            <span class="value" id="regionValue"><span class="skel m"></span></span>
          </div>
          <div class="item">
            <span class="label">ISP</span>
            <span class="value" id="ispValue"><span class="skel m"></span></span>
          </div>
        </div>

        <div class="hint rise d4" role="note">
          <div class="step"><span class="num">1</span><span>关闭 VPN / 代理 / 加速器 等网络工具。</span></div>
          <div class="step"><span class="num">2</span><span>切换到中国大陆境内的网络环境。</span></div>
          <div class="step"><span class="num">3</span><span>刷新本页后重新发起访问请求。</span></div>
        </div>
      </div>
    </article>
  </section>

  <!-- 页面底栏 -->
  <footer class="bottom rise d4">
    <span>© 2020-<script>document.write(new Date().getFullYear())</script>  广然笔记</span>
    <span>本站仅对中国大陆境内开放访问</span>
  </footer>
</div>

<script>
  // 时钟
  const clockEl = document.getElementById('clock');
  const tick = () => {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    clockEl.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  };
  tick(); setInterval(tick, 1000);

  // IP
  async function fetchIP() {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch('https://ipwho.is/', { signal: ctl.signal });
      clearTimeout(t);
      if (!r.ok) throw 0;
      const d = await r.json();
      if (d && d.success !== false) return d;
      throw 0;
    } catch {
      try {
        const r = await fetch('https://ipapi.co/json/');
        const d = await r.json();
        return {
          ip: d.ip, country: d.country_name, country_code: d.country_code,
          region: d.region, city: d.city,
          connection: { isp: d.org }
        };
      } catch { return null; }
    }
  }
  const setT = (id, t) => { const el = document.getElementById(id); el.textContent = t; };

  (async () => {
    const d = await fetchIP();
    if (!d) {
      ['ipValue','countryValue','regionValue','ispValue'].forEach(i => setT(i, '— — —'));
      return;
    }
    const region = [d.city, d.region].filter(Boolean).join(' · ') || '— — —';
    const isp = (d.connection && d.connection.isp) || d.org || '— — —';
    setT('ipValue', d.ip || '— — —');
    setT('countryValue', d.country || d.country_code || '— — —');
    setT('regionValue', region);
    setT('ispValue', isp);
  })();
</script>
</body>
</html>
